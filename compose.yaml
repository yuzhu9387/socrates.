services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random PostgreSQL admin password}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set a random application database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-database.sh:/docker-entrypoint-initdb.d/10-socrates.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://socrates_app:${DATABASE_PASSWORD}@db:5432/socrates
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3001}
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - 127.0.0.1:3001:3001
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
